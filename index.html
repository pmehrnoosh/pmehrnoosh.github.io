<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A polished portfolio and résumé generated from a single Markdown file."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d2238'/%3E%3Cpath d='M17 44V20h6l9 13 9-13h6v24h-7V31l-8 11-8-11v13z' fill='%23d8a94c'/%3E%3C/svg%3E"
    />
    <title>Portfolio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="profile-panel" aria-label="Profile and contact information">
        <div class="profile-panel__inner">
          <div class="identity">
            <h1 id="name"></h1>
            <p id="role" class="role">Product &amp; Operations Leader</p>
          </div>

          <div class="rule" aria-hidden="true"></div>

          <section class="contact" aria-labelledby="contact-heading">
            <h2 id="contact-heading">Contact</h2>
            <ul id="contact-list"></ul>
          </section>
        </div>
      </aside>

      <main id="content" class="content" aria-live="polite">
        <div class="loading">Loading portfolio…</div>
      </main>
    </div>

    <div id="status" class="status" role="status" aria-live="polite"></div>
    <script src="app.js" defer></script>
  </body>
</html>
